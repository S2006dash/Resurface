databases:
  - name: artha-db
    databaseName: artha_db
    user: artha_user
    plan: free

services:
  - type: web
    name: artha-app
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: DATABASE_URL
        fromDatabase:
          name: artha-db
          property: connectionString
